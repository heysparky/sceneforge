<form class="sceneforge-creator-form">
  <div class="form-group">
    <label for="sf-scene-name">{{localize "SCENEFORGE.Create.Name"}}</label>
    <input id="sf-scene-name" type="text" name="scene-name" value="{{defaultName}}" autofocus>
  </div>

  <div class="sf-picker-grid">
    {{#each types}}
    <label class="sf-type-option">
      <input type="radio" name="type" value="{{key}}"{{#if @first}} checked{{/if}}>
      <i class="fas {{icon}}" inert></i>
      <span class="sf-type-label">{{label}}</span>
      {{#if hint}}<span class="sf-type-hint">{{hint}}</span>{{/if}}
    </label>
    {{/each}}
  </div>
</form>
